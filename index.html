<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paytm AI: Voice & Memory for 30 Million Shopkeepers</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Hind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            silverLight: '#F8FAFC',
            silverPlat: '#E2E8F0',
            silverMesh: '#CBD5E1',
            shadySlate: '#64748B',
            darkSlate: '#1E293B',
            deepSteel: '#0F172A',
            payNavy: '#002E6E',
            tmCyan: '#00BAF2',
            paytmYellow: '#D97706',
            paytmGreen: '#059669',
          },
          fontFamily: {
            sans: ['Inter', 'Hind', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  
  <style>
    /* Dynamic Aesthetic Silvery Canvas */
    body {
      background: radial-gradient(circle at 50% 30%, #F8FAFC 0%, #E2E8F0 30%, #CBD5E1 60%, #94A3B8 85%, #475569 100%);
      background-attachment: fixed;
      color: #0F172A;
    }

    /* Shining Metallic Specular Title */
    .shining-steel-title {
      background: linear-gradient(90deg, #002E6E 0%, #00BAF2 25%, #FFFFFF 50%, #00BAF2 75%, #002E6E 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: steelShine 3.5s linear infinite;
    }

    @keyframes steelShine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Ambient Floating Gradient Orbs */
    .gradient-orb-1 {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 186, 242, 0.25) 0%, rgba(0, 46, 110, 0.15) 50%, transparent 70%);
      filter: blur(60px);
      animation: floatOrb 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.1); }
    }

    /* Staggered Frame Page Transitions */
    .stagger-frame {
      will-change: transform, opacity, filter;
      transition: transform 0.8s cubic-bezier(0, 0.95, 0.1, 1),
                  opacity 0.75s cubic-bezier(0, 0.95, 0.1, 1),
                  filter 0.75s cubic-bezier(0, 0.95, 0.1, 1);
    }

    .page-dissolving .stagger-1 { opacity: 0; filter: blur(12px); transform: translateX(40px); }
    .page-dissolving .stagger-2 { transition-delay: 60ms; opacity: 0; filter: blur(12px); transform: translateX(40px); }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased selection:bg-tmCyan selection:text-payNavy overflow-x-hidden relative">

  <!-- Ambient Floating Background Orb -->
  <div class="gradient-orb-1 top-1/4 left-1/4"></div>

  <!-- App Container Wrapper -->
  <div id="app-container" class="flex-grow flex flex-col relative z-10 justify-between">

    <!-- Top Navigation Header -->
    <header class="stagger-frame stagger-1 sticky top-0 z-50 py-4 px-6 bg-white/60 backdrop-blur-2xl border-b border-slate-300/50">
      <div class="max-w-[1700px] mx-auto flex items-center justify-between">
        
        <!-- Brand Logo -->
        <a href="index.html" onclick="navigateToPage('index.html'); return false;" class="flex items-center gap-3">
          <div class="bg-payNavy px-4 py-2 rounded-2xl shadow-md flex items-center gap-1">
            <span class="text-white text-2xl font-black tracking-tighter">pay</span>
            <span class="text-tmCyan text-2xl font-black tracking-tighter">tm</span>
            <span class="text-white text-xs font-bold ml-1">AI</span>
          </div>
        </a>

        <!-- 4-Page Flow Navigation Bar -->
        <nav class="flex items-center gap-2 bg-slate-200/70 p-1.5 rounded-full border border-slate-300/60 text-xs font-bold text-slate-800">
          <a href="index.html" onclick="navigateToPage('index.html'); return false;" class="px-5 py-2.5 rounded-full bg-payNavy text-white shadow-sm transition">
            Home
          </a>
          <a href="dashboard.html" onclick="navigateToPage('dashboard.html'); return false;" class="px-5 py-2.5 rounded-full hover:bg-white/80 transition flex items-center gap-1.5">
            <i data-lucide="layout-dashboard" class="w-4 h-4 text-tmCyan"></i> Dashboard
          </a>
          <a href="notifications.html" onclick="navigateToPage('notifications.html'); return false;" class="px-5 py-2.5 rounded-full hover:bg-white/80 transition flex items-center gap-1.5 relative">
            <i data-lucide="bell" class="w-4 h-4 text-paytmYellow"></i> Notifications
            <span class="w-2 h-2 rounded-full bg-paytmYellow animate-ping absolute top-2 right-2"></span>
          </a>
          <a href="about.html" onclick="navigateToPage('about.html'); return false;" class="px-5 py-2.5 rounded-full hover:bg-white/80 transition flex items-center gap-1.5">
            <i data-lucide="info" class="w-4 h-4 text-paytmGreen"></i> About & Contact Us
          </a>
        </nav>

      </div>
    </header>

    <!-- PAGE 1 HOME INTERFACE: ONLY THE PROJECT TOPIC NAME -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-6 py-12">
      <div class="stagger-frame stagger-2 max-w-5xl mx-auto space-y-10">
        
        <!-- SHINING METALLIC STAINLESS STEEL TITLE -->
        <h1 class="text-5xl sm:text-7xl lg:text-8xl font-black tracking-tight leading-[1.12] shining-steel-title drop-shadow-sm">
          Paytm AI: Voice & Memory for 30 Million Shopkeepers
        </h1>

        <!-- Quick Enter CTA to Dashboard -->
        <div class="pt-6">
          <a href="dashboard.html" onclick="navigateToPage('dashboard.html'); return false;" class="inline-flex items-center gap-3 px-10 py-5 rounded-full bg-payNavy text-white font-black text-base shadow-2xl hover:bg-tmCyan hover:text-payNavy transition group">
            Open Paytm AI Dashboard <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition"></i>
          </a>
        </div>

      </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="py-6 text-center text-xs font-mono text-slate-700 bg-white/30 border-t border-slate-300/40">
      Paytm Build for India AI Hackathon (Mumbai Edition) • Home Page
    </footer>

  </div>

  <script>
    lucide.createIcons();

    function navigateToPage(targetUrl) {
      const container = document.getElementById('app-container');
      container.classList.add('page-dissolving');
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 700);
    }
  </script>
</body>
</html>
